paths:
  /api/block/meta/{cid}:
    get:
      description: |-
        Retrieves metadata for a specific IPFS block.

        Returns block size, type, and child CIDs for the specified content identifier. Useful for inspecting IPFS data structures.

        See also:.*
      parameters:
      - description: 'Content identifier (CID) of the IPFS block. Example: bafybeieffnocaq7t4w4daagvydl32igft5oziyyaebqr6vx6rb3fwh2ab4'
        in: path
        name: cid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockMetaResponse'
          description: Block metadata
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get block details
      tags:
      - Content
  /api/block/meta/batch:
    post:
      description: |-
        Retrieves metadata for multiple IPFS blocks efficiently.

        Batch endpoint for getting block information for multiple CIDs in a single request, reducing API calls.

        See also:.*
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetBlockMetaBatchRequest'
        description: Batch request for block metadata
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Success
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
