          headers:
            Tus-Resumable:
              description: Protocol version
              schema:
                type: string
        "409":
          description: Conflict
          headers:
            Tus-Resumable:
              description: Protocol version
              schema:
                type: string
        "410":
          description: Gone
          headers:
            Tus-Resumable:
              description: Protocol version
              schema:
                type: string
        "412":
          description: Precondition Failed
          headers:
            Tus-Resumable:
              description: Protocol version
              schema:
                type: string
            Tus-Version:
              description: The Tus-Version response header MUST be a comma-separated
                list of protocol versions supported by the Server. The list MUST be
                sorted by Server's preference where the first one is the most preferred
                one.
              schema:
                type: string
        "415":
          description: Unsupported Media Type
          headers:
            Tus-Resumable:
              description: Protocol version
              schema:
                type: string
        "460":
          description: Checksums mismatch
          headers:
            Tus-Resumable:
              description: Protocol version
              schema:
                type: string
