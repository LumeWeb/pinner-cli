paths:
  /api/block/meta/{cid}:
    get:
      description: Gets metadata for a block.
      parameters:
      - description: The CID of the block.
        in: path
        name: cid
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlockMetaResponse'
          description: Block metadata
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
