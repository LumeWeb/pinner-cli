components:
  schemas:
    APIKeyCreateRequest:
      additionalProperties: false
      properties:
        name:
          type: string
      required:
        - name
      type: object
    APIKeyResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        name:
          type: string
        uuid:
          $ref: '#/components/schemas/BinaryUUID'
      required:
        - uuid
        - name
        - created_at
      type: object
    APIKeyResponseResponse:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/APIKeyResponse'
        total:
          type: integer
      required:
        - data
        - total
      type: object
    AccessModel:
      additionalProperties: false
      properties:
        matchers:
          $ref: '#/components/schemas/AccessModelDef'
        policy_definition:
          $ref: '#/components/schemas/AccessModelDef'
        policy_effect:
          $ref: '#/components/schemas/AccessModelDef'
        request_definition:
          $ref: '#/components/schemas/AccessModelDef'
        role_definition:
          $ref: '#/components/schemas/AccessModelDef'
      required:
        - request_definition
        - policy_definition
        - role_definition
        - policy_effect
        - matchers
      type: object
    AccessModelDef:
      additionalProperties: false
      properties:
        key:
          type: string
        value:
          type: string
      required:
        - key
        - value
      type: object
    AccessPolicy:
      additionalProperties: false
      properties:
        act:
          type: string
        dom:
          type: string
        obj:
          type: string
        sub:
          type: string
      required:
        - sub
        - dom
        - obj
        - act
      type: object
    AccountInfoResponse:
      additionalProperties: false
      properties:
        avatar:
          type: string
        created_at:
          format: date-time
          type: string
        email:
          type: string
        first_name:
          type: string
        id:
          type: integer
        last_name:
          type: string
        otp:
          type: boolean
        verified:
          type: boolean
      required:
        - id
        - email
        - first_name
        - last_name
        - verified
        - otp
      type: object
    AccountPermissionsResponse:
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/AccessModel'
        permissions:
          items:
            $ref: '#/components/schemas/AccessPolicy'
          type: array
      required:
        - permissions
        - model
      type: object
    BinUUID:
      items:
        type: integer
      maxItems: 16
      minItems: 16
      type: array
    BinaryUUID:
      additionalProperties: false
      properties:
        BinUUID:
          $ref: '#/components/schemas/BinUUID'
      required:
        - BinUUID
      type: object
    CreateAPIKeyResponse:
      additionalProperties: false
      properties:
        name:
          type: string
        token:
          type: string
        uuid:
          $ref: '#/components/schemas/BinaryUUID'
      required:
        - token
        - uuid
        - name
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          type: string
        message:
          type: string
        namespace:
          type: string
      required:
        - error
        - message
        - namespace
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          type: string
      required:
        - error
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
        remember:
          type: boolean
      required:
        - email
        - password
        - remember
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        otp:
          type: boolean
        token:
          type: string
      required:
        - token
      type: object
    OTPDisableRequest:
      additionalProperties: false
      properties:
        password:
          type: string
      required:
        - password
      type: object
    OTPGenerateResponse:
      additionalProperties: false
      properties:
        otp:
          type: string
      required:
        - otp
      type: object
    OTPValidateRequest:
      additionalProperties: false
      properties:
        otp:
          type: string
      required:
        - otp
      type: object
    OTPVerifyRequest:
      additionalProperties: false
      properties:
        otp:
          type: string
      required:
        - otp
      type: object
    OperationDetailResponse:
      additionalProperties: false
      properties:
        cid:
          type: string
        current_step:
          type: integer
        error:
          type: string
        estimated_completion_at:
          format: date-time
          type: string
        id:
          type: integer
        operation:
          type: string
        operation_display_name:
          type: string
        progress_percent:
          type: number
        protocol:
          type: string
        protocol_display_name:
          type: string
        started_at:
          format: date-time
          type: string
        status:
          type: string
        status_display_name:
          type: string
        status_message:
          type: string
        total_steps:
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - operation
        - operation_display_name
        - protocol
        - protocol_display_name
        - status
        - status_display_name
        - status_message
        - progress_percent
        - started_at
        - updated_at
      type: object
    OperationFilterItem:
      additionalProperties: false
      properties:
        description:
          type: string
        name:
          type: string
        value:
          type: string
      required:
        - value
        - name
      type: object
    OperationFiltersResponse:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/OperationFiltersResponseData'
      required:
        - data
      type: object
    OperationFiltersResponseData:
      additionalProperties: false
      properties:
        operations:
          items:
            $ref: '#/components/schemas/OperationFilterItem'
          type: array
        protocols:
          items:
            $ref: '#/components/schemas/OperationFilterItem'
          type: array
        statuses:
          items:
            $ref: '#/components/schemas/OperationFilterItem'
          type: array
      required:
        - statuses
        - operations
        - protocols
      type: object
    OperationFiltersResponseResponse:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/OperationFiltersResponse'
        total:
          type: integer
      required:
        - data
        - total
      type: object
    OperationListItem:
      additionalProperties: false
      properties:
        cid:
          type: string
        current_step:
          type: integer
        error:
          type: string
        estimated_completion_at:
          format: date-time
          type: string
        id:
          type: integer
        operation:
          type: string
        operation_display_name:
          type: string
        progress_percent:
          type: number
        protocol:
          type: string
        protocol_display_name:
          type: string
        started_at:
          format: date-time
          type: string
        status:
          type: string
        status_display_name:
          type: string
        status_message:
          type: string
        total_steps:
          type: integer
        updated_at:
          format: date-time
          type: string
      required:
        - id
        - operation
        - operation_display_name
        - protocol
        - protocol_display_name
        - status
        - status_display_name
        - status_message
        - progress_percent
        - started_at
        - updated_at
      type: object
    OperationListItemResponse:
      additionalProperties: false
      properties:
        data:
          items:
            $ref: '#/components/schemas/OperationListItem'
          type: array
        total:
          type: integer
      required:
        - data
        - total
      type: object
    PasswordResetRequest:
      additionalProperties: false
      properties:
        email:
          type: string
      required:
        - email
      type: object
    PasswordResetVerifyRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
        token:
          type: string
      required:
        - email
        - token
        - password
      type: object
    PongResponse:
      additionalProperties: false
      properties:
        ping:
          type: string
        token:
          type: string
      required:
        - ping
        - token
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        password:
          type: string
      required:
        - first_name
        - last_name
        - email
        - password
      type: object
    ResendVerifyEmailRequest:
      additionalProperties: false
      properties:
        email:
          type: string
      required:
        - email
      type: object
    UUID:
      items:
        type: integer
      maxItems: 16
      minItems: 16
      type: array
    UpdateEmailRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      type: object
    UpdatePasswordRequest:
      additionalProperties: false
      properties:
        current_password:
          type: string
        new_password:
          type: string
      required:
        - current_password
        - new_password
      type: object
    UpdateProfileRequest:
      additionalProperties: false
      properties:
        first_name:
          type: string
        last_name:
          type: string
      type: object
    UploadLimitResponse:
      additionalProperties: false
      properties:
        limit:
          type: integer
      required:
        - limit
      type: object
    VerifyEmailRequest:
      additionalProperties: false
      properties:
        email:
          type: string
        token:
          type: string
      required:
        - email
        - token
      type: object
info:
  description: API endpoints for managing user accounts, authentication, and API keys.
  title: Account API
  version: develop
openapi: 3.0.0
paths:
  /api/account:
    delete:
      description: Initiates the process to delete the authenticated user's account.
      responses:
        "200":
          description: Account deletion requested
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Request account deletion
    get:
      description: Retrieves information about the authenticated user's account.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfoResponse'
          description: Account information
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not authenticated
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Account not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Failed to retrieve account info
      summary: Get account information
    patch:
      description: Updates the authenticated user's profile information. Email cannot
        be updated through this endpoint.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        description: Profile update data
        required: true
      responses:
        "200":
          description: Profile updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The login credentials provided are invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The requested user was not found.
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: A database operation failed.
      summary: Update profile information
  /api/account/avatar:
    get:
      description: Retrieves the authenticated user's profile picture
      responses:
        "200":
          description: Avatar image
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get Avatar
    post:
      description: Uploads a profile picture/avatar
      requestBody:
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  type: string
              required:
                - file
              type: object
        description: Avatar file to upload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Success
        "204":
          description: Avatar uploaded
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Upload Avatar
  /api/account/keys:
    get:
      description: Retrieves a list of API keys for the authenticated user.
      parameters:
        - description: Ending index of the items to return (exclusive). Defaults to
            10.
          in: query
          name: _end
          schema:
            type: integer
        - description: Starting index of the items to return (0-based). Defaults to
            0.
          in: query
          name: _start
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyResponseResponse'
          description: List of API Keys
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: List API Keys
    post:
      description: Creates a new API key for the authenticated user.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreateRequest'
        description: API Key name
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
          description: API Key created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Create API Key
  /api/account/keys/{keyID}:
    delete:
      description: Deletes a specific API key for the authenticated user.
      parameters:
        - description: The UUID of the API key to delete
          in: path
          name: keyID
          required: true
          schema:
            $ref: '#/components/schemas/UUID'
      responses:
        "200":
          description: API Key deleted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Delete API Key
  /api/account/password-reset/confirm:
    post:
      description: Resets the user's password using a token received via email.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetVerifyRequest'
        description: Email, token, and new password
        required: true
      responses:
        "200":
          description: Password reset successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Confirm password reset
  /api/account/password-reset/request:
    post:
      description: Initiates the password reset process by sending a reset link to
        the user's email.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        description: Email address
        required: true
      responses:
        "200":
          description: Password reset email sent (if account exists)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The login credentials provided are invalid.
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A database operation failed.
      summary: Request password reset
  /api/account/permissions:
    get:
      description: Retrieves the access control policies and model for the authenticated
        user.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPermissionsResponse'
          description: Account permissions
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Get account permissions
  /api/account/update-email:
    post:
      description: Updates the authenticated user's email address.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailRequest'
        description: New email and current password
        required: true
      responses:
        "200":
          description: Email updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update email address
  /api/account/update-password:
    post:
      description: Updates the authenticated user's password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
        description: Current and new passwords
        required: true
      responses:
        "200":
          description: Password updated successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Update password
  /api/account/verify-email:
    post:
      description: Verifies a user's email address using a token sent via email. Optionally
        auto-login user if they don't have 2FA enabled.
      parameters:
        - description: 'Auto-login user after verification (boolean: true/false; also
          accepts 1/0).'
          in: query
          name: login
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        description: Email and verification token
        required: true
      responses:
        "200":
          description: Email verified successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Verify email address
  /api/account/verify-email/resend:
    post:
      description: Resends the email verification link to the user's email address.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerifyEmailRequest'
        description: Email address
        required: true
      responses:
        "200":
          description: Verification email sent (if account exists and is not verified)
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal server error
      summary: Resend email verification
  /api/auth/key:
    post:
      description: Exchanges an API key for a JWT.
      parameters:
        - description: API Key followed by the key
          in: header
          name: Authorization
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: JWT issued
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The login credentials provided are invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: This account is pending deletion.
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: A database operation failed.
      summary: Authenticate with API Key
  /api/auth/login:
    post:
      description: Authenticates a user using email and password.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: Login credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: OTP required
        "302":
          description: Redirect to auth complete (for non-OTP)
          headers:
            Location:
              description: URL to redirect to
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The login credentials provided are invalid.
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: This account is pending deletion.
        "404":
          content:
