name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Knope
        uses: knope-dev/action@v2.1.0
        with:
          version: 0.21.7

      - name: Create Release
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Set RELEASE_VERSION
        run: echo "RELEASE_VERSION=$(grep '^module' go.mod | awk -F'// ' '{print $2}')" >> $GITHUB_ENV

      - name: Create and push version tag
        run: |
          VERSION="${RELEASE_VERSION}"
          if [ -z "$VERSION" ]; then
            echo "Error: RELEASE_VERSION is empty" >&2
            exit 1
          fi
          git tag -f "${VERSION}"
          git push origin -f "${VERSION}"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Export Go version
        run: echo "GO_VERSION=$(go version | awk '{print $3}' | sed 's/go//')" >> $GITHUB_ENV

      - name: Run GoReleaser (goreleaser-cross)
        run: |
          docker run --rm \
            -v "$PWD":/go/src/go.lumeweb.com/pinner-cli \
            -w /go/src/go.lumeweb.com/pinner-cli \
            -e GITHUB_TOKEN \
            -e GO_VERSION \
            -e PROJECT_DIR=/go/src/go.lumeweb.com/pinner-cli \
            ghcr.io/goreleaser/goreleaser-cross:v1.26 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Dispatch version update to get.pinner.xyz
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: LumeWeb/get.pinner.xyz
          event-type: pinner-cli-release
          client-payload: '{"version": "${{ env.RELEASE_VERSION }}"}'
