name: Go

on:
  pull_request:
    branches: ['develop']
  push:
    branches: ['develop']
  workflow_dispatch:

permissions:
  pull-requests: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            race: true
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            race: false
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            race: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            race: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            race: true
          - os: windows-latest
            goos: windows
            goarch: arm64
            race: false

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      # No `go mod verify`: the ensure-canvasassets step below regenerates
      # pinner's gitignored embed inputs inside the module cache, leaving a
      # pnpm node_modules/ tree in the cached pinner module. `go mod verify`
      # requires a pristine cache and fails on that unexpected directory, and
      # setup-go persists that dirty cache across jobs. Module integrity is
      # still enforced by go.sum verification during download/build, so the
      # redundant verify step is intentionally omitted.

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ code
        run: templ generate

      - name: Stage canvasassets embed inputs
        uses: ./.github/actions/ensure-canvasassets

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # sqlite_fts5 is required to compile FTS5 into mattn/go-sqlite3 (vault
        # name search); without it the 0007 vault migration fails at runtime.
        run: go build -v -tags "sqlite_fts5" ./...

      - name: Test
        run: go test -v -count=1 ${{ matrix.race && '-race' || '' }} -tags "sqlite_fts5" ./...

  snapshot:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Export Go version
        run: echo "GO_VERSION=$(go version | awk '{print $3}' | sed 's/go//')" >> $GITHUB_ENV

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ code
        run: templ generate

      # Stage pinner's canvasassets into the host module cache. This must run
      # on the host (not the container) because pinner's `make assets` needs
      # the JS toolchain; the staged embed inputs are then handed to the
      # goreleaser-cross container below by bind-mounting the host module cache.
      - name: Stage canvasassets embed inputs
        uses: ./.github/actions/ensure-canvasassets

      - name: Build snapshot artifacts (goreleaser-cross)
        run: |
          # Tee the goreleaser output to ci-logs/ so it can be attached as its
          # own artifact (ci-logs/ lives outside dist/, which goreleaser --clean
          # wipes at start).
          mkdir -p ci-logs
          set -o pipefail
          # Bind-mount the host module cache into the container (its default
          # GOMODCACHE is /go/pkg/mod) so the staged canvasassets embed inputs
          # the host produced above are visible to the cross-build, which
          # otherwise resolves go.lumeweb.com/pinner from a fresh cache without
          # them.
          docker run --rm \
            -v "$PWD":/go/src/go.lumeweb.com/pinner-cli \
            -v "$(go env GOMODCACHE)":/go/pkg/mod \
            -w /go/src/go.lumeweb.com/pinner-cli \
            -e GO_VERSION \
            ghcr.io/goreleaser/goreleaser-cross:v1.27 \
            release --snapshot --clean --skip=docker 2>&1 | tee ci-logs/goreleaser.log

      - name: Build MCP bundles (.mcpb)
        run: |
          set -o pipefail
          # The following block is teed to ci-logs/mcpb.log so the run's MCP
          # bundle output is captured as a dedicated logs artifact. The goreleaser
          # publishers pipe (which builds .mcpb at release time) is skipped in
          # snapshot builds, so pack one bundle per compiled binary here. This
          # makes a set of .mcpb files available as CI artifacts on every
          # PR/merge to develop, not just at release.
          #
          # The goreleaser-cross container writes dist/ as root, so the runner
          # user cannot create dist/mcpb. Re-own the tree first so packing can
          # write into it (and the upload step below can read it).
          {
            sudo chown -R "$(id -u):$(id -g)" dist
            if npm install --prefix /opt/runner-mcpb -g @anthropic-ai/mcpb >/dev/null 2>&1; then
              echo "/opt/runner-mcpb/bin" >> "$GITHUB_PATH"
            else
              echo "::warning::mcpb CLI unavailable on this runner; the pack script will fall back to a python3 zip"
            fi
            SNAP_VERSION="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
            # One bundle per supported desktop target (goos/arch tuple).
            PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
            for pair in $PLATFORMS; do
              goos="${pair%/*}"; goarch="${pair#*/}"
              bin="$(find dist -type f \( -name 'pinner' -o -name 'pinner.exe' \) -not -path '*/mcpb/*' -path "*${goos}_${goarch}*" 2>/dev/null | head -n1)"
              if [ -z "$bin" ]; then
                echo "::warning::no ${goos}/${goarch} binary found in dist/; skipping .mcpb"
                continue
              fi
              echo ">> packing ${goos}/${goarch} from $bin"
              ./scripts/mcpb-pack.sh "$bin" "$goos" "$goarch" "$SNAP_VERSION"
            done
            # Print what was produced; guard against no bundles yet existing.
            shopt -s nullglob
            mbundles=(dist/mcpb/*.mcpb)
            if [ ${#mbundles[@]} -eq 0 ]; then
              echo "::warning::no .mcpb bundles produced"
            else
              echo ">> MCP bundles produced:" && ls -lh "${mbundles[@]}"
            fi
          } 2>&1 | tee ci-logs/mcpb.log

      - name: Upload split artifacts
        uses: ./.github/actions/upload-dist-artifacts
        with:
          name: pinner-cli
          include-snapshot: 'true'
          retention-days: 90

  # Runs the managed pinner-mcp service install/start against a REAL systemd
  # user manager. This is the regression protection for the http-install service
  # lifecycle: unit written, `systemctl --user` reports active, and the
  # underlying pinner MCP server comes up OAuth-protected and serves. Every
  # other systemd test in this repo uses command/fs fakes; this job exercises
  # the real init system.
  #
  # Runs directly on the ubuntu-latest runner's own systemd user session (the
  # `runner` user already has a live `systemd --user` manager), NOT in a
  # container: cgroup-v2-unified containers cannot delegate a per-user cgroup
  # subtree, so a user manager cannot come up there. The runner's login session
  # is a fully deterministic systemd host.
  systemd-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ code
        run: templ generate

      - name: Stage canvasassets embed inputs
        uses: ./.github/actions/ensure-canvasassets

      - name: Build pinner binary + integration test binary
        run: |
          mkdir -p dist
          go build -tags "sqlite_fts5" -o dist/pinner ./cmd/pinner
          go test -tags "integration sqlite_fts5" -c -o dist/service-integration.test ./internal/service/

      - name: Run systemd user-service integration test
        env:
          PINNER_BIN: ${{ github.workspace }}/dist/pinner
          REQUIRE_SYSTEMD: '1'
        run: |
          # The runner's own login session already has a live user manager;
          # linger just guarantees it for this user, and XDG_RUNTIME_DIR points
          # systemctl --user at that session's socket.
          sudo loginctl enable-linger "$USER" || true
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          ./dist/service-integration.test \
            -test.v -test.run TestSystemdUserServiceInstallServesOAuth

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Verify templ formatting and generate
        run: |
          templ fmt .
          git diff --exit-code -- '*.templ' || { echo "templ source files are not formatted: run 'templ fmt .' and commit" >&2; exit 1; }
          templ generate

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Stage canvasassets embed inputs
        uses: ./.github/actions/ensure-canvasassets

      - name: Vet
        run: go vet ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ code
        run: templ generate

      - name: Stage canvasassets embed inputs
        uses: ./.github/actions/ensure-canvasassets

      - name: Test with coverage
        run: go test -v -race -tags "sqlite_fts5" -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Extract coverage percentage
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "percent=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Find coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Code Coverage Report'

      - name: Create or update coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Code Coverage Report

            **Total Coverage:** ${{ steps.coverage.outputs.percent }}

            Generated from commit: ${{ github.sha }}
            **Repository:** ${{ github.repository }}
          edit-mode: replace
