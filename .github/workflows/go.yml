name: Go

on:
  pull_request:
    branches: ['develop']
  push:
    branches: ['develop']
  workflow_dispatch:

permissions:
  pull-requests: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            race: true
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            race: false
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            race: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            race: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            race: true
          - os: windows-latest
            goos: windows
            goarch: arm64
            race: false

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v ./...

      - name: Test
        run: go test -v -count=1 ${{ matrix.race && '-race' || '' }} ./...

  snapshot:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Export Go version
        run: echo "GO_VERSION=$(go version | awk '{print $3}' | sed 's/go//')" >> $GITHUB_ENV

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Build snapshot artifacts
        run: goreleaser release --snapshot --clean

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinner-cli-snapshot
          path: dist/
          retention-days: 90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Vet
        run: go vet ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Extract coverage percentage
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "percent=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Find coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Code Coverage Report'

      - name: Create or update coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Code Coverage Report

            **Total Coverage:** ${{ steps.coverage.outputs.percent }}

            Generated from commit: ${{ github.sha }}
            **Repository:** ${{ github.repository }}
          edit-mode: replace
