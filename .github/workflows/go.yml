name: Go

on:
  pull_request:
    branches: ['develop']
  push:
    branches: ['develop']
  workflow_dispatch:

permissions:
  pull-requests: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            race: true
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            race: false
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
            race: true
          - os: macos-latest
            goos: darwin
            goarch: arm64
            race: true
          - os: windows-latest
            goos: windows
            goarch: amd64
            race: true
          - os: windows-latest
            goos: windows
            goarch: arm64
            race: false

    runs-on: ${{ matrix.os }}
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    steps:
      - uses: actions/checkout@v6

      - name: Build JS bundles
        uses: ./.github/actions/js-bundle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ code
        run: templ generate

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -v ./...

      - name: Test
        run: go test -v -count=1 ${{ matrix.race && '-race' || '' }} ./...

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JS deps
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm exec tsc --noEmit
        working-directory: packages/apps
      - name: Test (vitest)
        run: pnpm test
        working-directory: packages/apps
      - name: Build bundles
        run: pnpm build

  snapshot:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6

      - name: Build JS bundles
        uses: ./.github/actions/js-bundle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Export Go version
        run: echo "GO_VERSION=$(go version | awk '{print $3}' | sed 's/go//')" >> $GITHUB_ENV

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ code
        run: templ generate

      - name: Build snapshot artifacts (goreleaser-cross)
        run: |
          docker run --rm \
            -v "$PWD":/go/src/go.lumeweb.com/pinner-cli \
            -w /go/src/go.lumeweb.com/pinner-cli \
            -e GO_VERSION \
            ghcr.io/goreleaser/goreleaser-cross:v1.26 \
            release --snapshot --clean --skip=docker

      - name: Build MCP bundles (.mcpb)
        run: |
          # The goreleaser publishers pipe (which builds .mcpb at release time)
          # is skipped in snapshot builds, so pack one bundle per compiled
          # binary here. This makes a set of .mcpb files available as CI
          # artifacts on every PR/merge to develop, not just at release.
          #
          # The goreleaser-cross container writes dist/ as root, so the runner
          # user cannot create dist/mcpb. Re-own the tree first so packing can
          # write into it (and the upload-artifact step below can read it).
          sudo chown -R "$(id -u):$(id -g)" dist
          if npm install --prefix /opt/runner-mcpb -g @anthropic-ai/mcpb >/dev/null 2>&1; then
            echo "/opt/runner-mcpb/bin" >> "$GITHUB_PATH"
          else
            echo "::warning::mcpb CLI unavailable on this runner; the pack script will fall back to a python3 zip"
          fi
          SNAP_VERSION="$(git describe --tags --always --dirty 2>/dev/null || git rev-parse --short HEAD)"
          # One bundle per supported desktop target (goos/arch tuple).
          PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for pair in $PLATFORMS; do
            goos="${pair%/*}"; goarch="${pair#*/}"
            bin="$(find dist -type f \( -name 'pinner' -o -name 'pinner.exe' \) -not -path '*/mcpb/*' -path "*${goos}_${goarch}*" 2>/dev/null | head -n1)"
            if [ -z "$bin" ]; then
              echo "::warning::no ${goos}/${goarch} binary found in dist/; skipping .mcpb"
              continue
            fi
            echo ">> packing ${goos}/${goarch} from $bin"
            ./scripts/mcpb-pack.sh "$bin" "$goos" "$goarch" "$SNAP_VERSION"
          done
          # Print what was produced; guard against no bundles yet existing.
          shopt -s nullglob
          mbundles=(dist/mcpb/*.mcpb)
          if [ ${#mbundles[@]} -eq 0 ]; then
            echo "::warning::no .mcpb bundles produced"
          else
            echo ">> MCP bundles produced:" && ls -lh "${mbundles[@]}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinner-cli-snapshot
          path: dist/
          retention-days: 90

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build JS bundles
        uses: ./.github/actions/js-bundle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Verify templ formatting and generate
        run: |
          templ fmt .
          git diff --exit-code -- '*.templ' || { echo "templ source files are not formatted: run 'templ fmt .' and commit" >&2; exit 1; }
          templ generate

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          install-only: true

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Vet
        run: go vet ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build JS bundles
        uses: ./.github/actions/js-bundle

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Download dependencies
        run: go mod download

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.1020

      - name: Generate templ code
        run: templ generate

      - name: Test with coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Generate coverage report
        run: go tool cover -func=coverage.out

      - name: Extract coverage percentage
        if: github.event_name == 'pull_request'
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "percent=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Find coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Code Coverage Report'

      - name: Create or update coverage comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Code Coverage Report

            **Total Coverage:** ${{ steps.coverage.outputs.percent }}

            Generated from commit: ${{ github.sha }}
            **Repository:** ${{ github.repository }}
          edit-mode: replace
