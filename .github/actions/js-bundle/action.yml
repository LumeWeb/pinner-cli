# js-bundle: build the MCP App JS bundles (packages/apps) and copy them into
# internal/mcpapp/appsassets/dist/ so Go's //go:embed picks them up. Every Go
# build/test step embeds these bundles and the Go build fails if they
# are absent, so this action must run before any `go build`/`go test`.
name: Build JS bundles
description: Builds packages/apps self-contained bundles and stages them for Go embedding

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@v5
      with:
        # Version comes from the `packageManager` field in package.json
        # (pnpm@10.33.2). Do NOT also pass `version` here — pnpm/action-setup@v5
        # rejects multiple version specs with "Multiple versions of pnpm".
        run_install: false

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml

    - name: 'Check out mcpcanvas (file: dependency)'
      # packages/apps pins @lumeweb/mcpcanvas via a file: spec that the root
      # pnpm-lock.yaml resolves to the sibling directory ../mcpcanvas/ui —
      # OUTSIDE $GITHUB_WORKSPACE, where actions/checkout cannot clone, so do
      # it with plain git. Pin to the same commit go.mod requires
      # (go.lumeweb.com/mcpcanvas v0.0.0-20260907112052-7adbd4d8dcac, the
      # develop head) so the runtime sources pnpm links match the Go module.
      shell: bash
      run: |
        target="$GITHUB_WORKSPACE/../mcpcanvas"
        if [ -d "$target/.git" ]; then
          git -C "$target" fetch --quiet origin
        else
          git clone --quiet https://github.com/LumeWeb/mcpcanvas "$target"
        fi
        git -C "$target" checkout --quiet --force 7adbd4d8dcac9a71c596db04debb3e3e4f2e1892

    - name: Install JS deps
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build JS bundles
      # Root `build` script filters to @pinner/apps (see package.json).
      run: pnpm build
      shell: bash

    - name: Stage bundles for Go embedding
      run: |
        mkdir -p internal/mcpapp/appsassets/dist
        cp packages/apps/dist/*.js internal/mcpapp/appsassets/dist/
      shell: bash

    - name: Build MCP Apps Tailwind theme
      # Compile internal/mcpapp/css/input.css -> internal/mcpapp/css/tailwind.css
      # (embedded by Go via go:embed). Same rationale as the bundles: must exist
      # before any go build/test.
      run: pnpm build:css
      shell: bash
