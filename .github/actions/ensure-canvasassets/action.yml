# ensure-canvasassets: stage the go.lumeweb.com/pinner MCP App embed inputs
# (appsassets bundles + mcpcanvas manifest + compiled Tailwind theme) wherever
# this runner resolves the pinner module before any `go build`/`go test`.
#
# pinner owns the JS source and ships only the gitignored build *inputs*; the
# embed outputs are regenerated by its shared scripts/ensure-canvasassets.sh
# (delegated to via this CLI's `make ensure-canvasassets`), writing into the
# pinned module's dir in the module cache. Every Go compile that imports
# go.lumeweb.com/pinner/canvasassets fails with "pattern appsassets: no
# matching files found" unless this runs first. This action must therefore run
# before every `go build`/`go test`/`go vet`/goreleaser step in CI.
name: Stage canvasassets
description: Set up the JS toolchain and stage pinner's MCP App embed inputs for Go
runs:
  using: composite
  steps:
    # The CLI no longer owns a package.json, so pnpm's version can't come from
    # a `packageManager` field; pin down the same pnpm the pinner workspace
    # declares (see pinner's package.json) so `make -C <pinner> assets` runs
    # with a compatible corepack-less pnpm.
    - uses: pnpm/action-setup@v5
      with:
        version: 10.33.2
        run_install: false

    # No pnpm cache: the CLI has no lockfile of its own (pinner's lives in the
    # module cache at a per-version path), so pnpm-install caching would be a
    # no-op/awkward. Leave it off; staging only installs pinner's few deps.
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Stage canvasassets embed inputs
      run: make ensure-canvasassets
      shell: bash
