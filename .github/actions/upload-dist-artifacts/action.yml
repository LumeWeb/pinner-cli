# upload-dist-artifacts: split a GoReleaser `dist/` tree into focused CI
# artifacts so consumers can grab just what they need (e.g. a single .mcpb,
# a raw binary, or one deb/rpm) instead of pulling one monolithic archive.
#
# Idempotent per-artifact globs: each upload uses a narrow `path` with
# upload-artifact's default `if-no-files-found: warn`, so any category that is
# absent for a given build simply no-ops without failing the job.
name: Upload split dist artifacts
description: Uploads GoReleaser dist/ outputs (binaries, mcpb, archives, packages, logs) as focused, dedicated artifacts

inputs:
  # Base name prefix for every artifact, e.g. "pinner-cli" produces
  # pinner-cli-binaries, pinner-cli-mcpb, pinner-cli-deb-amd64, ...
  name:
    description: Base artifact name prefix
    required: true

  # Paths are resolved relative to the GitHub workspace root.
  dist-path:
    description: Path to the GoReleaser dist/ directory
    required: false
    default: dist

  binary-name:
    description: Name of the compiled binary (used to resolve raw binary + .mcpb filenames)
    required: false
    default: pinner

  project-name:
    description: GoReleaser project name (prefix of archive and package filenames, e.g. pinner-cli)
    required: false
    default: pinner-cli

  logs-path:
    description: Path to a directory of *.log files to upload as the logs artifact
    required: false
    default: ci-logs

  retention-days:
    description: Artifact retention in days
    required: false
    default: '90'

  include-snapshot:
    description: Also upload the entire dist/ tree as a single <name>-snapshot archive
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Upload full dist snapshot
      if: ${{ inputs.include-snapshot == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}-snapshot
        path: ${{ inputs.dist-path }}/
        retention-days: ${{ inputs.retention-days }}

    # Raw binaries, .mcpb bundles, and release archives are all OS/arch-specific
    # (Go cgo). Delegate each desktop target to upload-platform-artifacts so the
    # platform glob/naming logic lives in one place instead of being re-derived
    # here.
    - name: Upload platform artifacts (linux/amd64)
      uses: ./.github/actions/upload-platform-artifacts
      with:
        name: ${{ inputs.name }}
        os: linux
        arch: amd64
        dist-path: ${{ inputs.dist-path }}
        binary-name: ${{ inputs.binary-name }}
        project-name: ${{ inputs.project-name }}
        retention-days: ${{ inputs.retention-days }}

    - name: Upload platform artifacts (linux/arm64)
      uses: ./.github/actions/upload-platform-artifacts
      with:
        name: ${{ inputs.name }}
        os: linux
        arch: arm64
        dist-path: ${{ inputs.dist-path }}
        binary-name: ${{ inputs.binary-name }}
        project-name: ${{ inputs.project-name }}
        retention-days: ${{ inputs.retention-days }}

    - name: Upload platform artifacts (darwin/amd64)
      uses: ./.github/actions/upload-platform-artifacts
      with:
        name: ${{ inputs.name }}
        os: darwin
        arch: amd64
        dist-path: ${{ inputs.dist-path }}
        binary-name: ${{ inputs.binary-name }}
        project-name: ${{ inputs.project-name }}
        retention-days: ${{ inputs.retention-days }}

    - name: Upload platform artifacts (darwin/arm64)
      uses: ./.github/actions/upload-platform-artifacts
      with:
        name: ${{ inputs.name }}
        os: darwin
        arch: arm64
        dist-path: ${{ inputs.dist-path }}
        binary-name: ${{ inputs.binary-name }}
        project-name: ${{ inputs.project-name }}
        retention-days: ${{ inputs.retention-days }}

    - name: Upload platform artifacts (windows/amd64)
      uses: ./.github/actions/upload-platform-artifacts
      with:
        name: ${{ inputs.name }}
        os: windows
        arch: amd64
        dist-path: ${{ inputs.dist-path }}
        binary-name: ${{ inputs.binary-name }}
        project-name: ${{ inputs.project-name }}
        retention-days: ${{ inputs.retention-days }}

    - name: Upload platform artifacts (windows/arm64)
      uses: ./.github/actions/upload-platform-artifacts
      with:
        name: ${{ inputs.name }}
        os: windows
        arch: arm64
        dist-path: ${{ inputs.dist-path }}
        binary-name: ${{ inputs.binary-name }}
        project-name: ${{ inputs.project-name }}
        retention-days: ${{ inputs.retention-days }}

    # Each .deb/.rpm filename embeds the project version, so its name varies
    # build to build. Stage each package under a deterministic unique name and
    # upload with archive: false. Besides keeping them direct (unzipped)
    # downloads, this avoids the default `artifact.zip` name that archive: true
    # with no `name` would use, which collides across steps (409).
    - name: Stage packages (unique names)
      shell: bash
      run: |
        mkdir -p "${{ inputs.dist-path }}/.artifact-staging"
        # GoReleaser names packages <project>_<version>_<os>_<arch>.<ext>, so the
        # on-disk filename uses `linux_amd64`; the staged copy uses a cleaner
        # `linux-amd64` name that is also the upload path below.
        for spec in "deb:linux_amd64" "deb:linux_arm64" "rpm:linux_amd64" "rpm:linux_arm64"; do
          ext="${spec%%:*}"; plat="${spec##*:}"   # e.g. deb + linux_amd64
          # Expect exactly one package per platform. The version-wildcarded
          # glob could match several (e.g. stale dist/), so require a unique
          # match instead of silently picking an arbitrary one with head -n1.
          matches="$(find "${{ inputs.dist-path }}" -maxdepth 1 -type f \
            -name '${{ inputs.project-name }}_*_'"${plat}"'.'"${ext}"'' 2>/dev/null)"
          count="$(printf '%s\n' "$matches" | grep -c . || true)"
          if [ "$count" -eq 0 ]; then
            echo "::warning::no ${plat} ${ext} package found in dist/; skipping"
            continue
          fi
          if [ "$count" -gt 1 ]; then
            echo "::warning::expected exactly one ${plat} ${ext} package, found $count; skipping"
            continue
          fi
          staged_plat="${plat//_/-}"              # linux_amd64 -> linux-amd64
          cp "$matches" "${{ inputs.dist-path }}/.artifact-staging/${{ inputs.project-name }}-${staged_plat}.${ext}"
        done

    - name: Upload Debian package (amd64)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.dist-path }}/.artifact-staging/${{ inputs.project-name }}-linux-amd64.deb
        archive: false
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Upload Debian package (arm64)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.dist-path }}/.artifact-staging/${{ inputs.project-name }}-linux-arm64.deb
        archive: false
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Upload RPM package (amd64)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.dist-path }}/.artifact-staging/${{ inputs.project-name }}-linux-amd64.rpm
        archive: false
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Upload RPM package (arm64)
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.dist-path }}/.artifact-staging/${{ inputs.project-name }}-linux-arm64.rpm
        archive: false
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Upload logs
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}-logs
        path: ${{ inputs.logs-path }}/*.log
        retention-days: ${{ inputs.retention-days }}
