# upload-platform-artifacts: upload the per-platform output of a GoReleaser
# dist/ tree (raw binary, .mcpb, release archive) for a single OS/arch pair.
#
# The outer upload-dist-artifacts action calls this once per desktop target,
# so the platform-specific glob logic (Windows uses pinner.exe + .zip, unix
# uses pinner + .tar.gz) lives in exactly one place instead of being repeated
# and re-derived at every call site.
#
# Every artifact here is a single file, so it is uploaded with
# actions/upload-artifact@v7 + archive: false. That keeps the file directly
# downloadable from the UI/run summary without being wrapped in a zip
# (upload-artifact@v4 and older always zip). With archive: false the artifact
# is named after the uploaded file itself, so each file is staged under a
# unique name before upload (raw binaries are all called `pinner`, which would
# otherwise collide across platforms).
name: Upload platform artifacts
description: Uploads raw binary, mcpb bundle, and release archive for a single OS/arch, with platform-specific naming resolved here

inputs:
  name:
    description: Base artifact name prefix
    required: true
  os:
    description: GOOS (linux|darwin|windows)
    required: true
  arch:
    description: GOARCH (amd64|arm64)
    required: true
  dist-path:
    description: Path to the GoReleaser dist/ directory (relative to workspace root)
    required: false
    default: dist
  binary-name:
    description: Name of the compiled binary (used to resolve raw binary + .mcpb filenames)
    required: false
    default: pinner
  project-name:
    description: GoReleaser project name (prefix of archive and package filenames, e.g. pinner-cli)
    required: false
    default: pinner-cli
  retention-days:
    description: Artifact retention in days
    required: false
    default: '90'

runs:
  using: 'composite'
  steps:
    # With archive: false the uploaded file's name becomes the artifact name,
    # so stage the raw binary under a unique per-platform name first. This
    # avoids every OS/arch pair colliding on the artifact name `pinner`.
    - name: Stage raw binary (unique name)
      shell: bash
      run: |
        bin="$(find "${{ inputs.dist-path }}" -type f \
          \( -name '${{ inputs.binary-name }}${{ inputs.os == 'windows' && '.exe' || '' }}' \) \
          -not -path '*/mcpb/*' \
          -path '*${{ inputs.os }}_${{ inputs.arch }}*' \
          2>/dev/null | head -n1)"
        if [ -z "$bin" ]; then
          echo "::warning::no ${{ inputs.os }}/${{ inputs.arch }} binary found in dist/; skipping raw binary"
          exit 0
        fi
        mkdir -p "${{ inputs.dist-path }}/.artifact-staging"
        cp "$bin" "${{ inputs.dist-path }}/.artifact-staging/${{ inputs.binary-name }}-${{ inputs.os }}-${{ inputs.arch }}${{ inputs.os == 'windows' && '.exe' || '' }}"

    - name: Upload raw binary
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.dist-path }}/.artifact-staging/${{ inputs.binary-name }}-${{ inputs.os }}-${{ inputs.arch }}${{ inputs.os == 'windows' && '.exe' || '' }}
        archive: false
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Upload MCP bundle
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.dist-path }}/mcpb/${{ inputs.binary-name }}-${{ inputs.os }}-${{ inputs.arch }}.mcpb
        archive: false
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}

    - name: Upload release archive
      uses: actions/upload-artifact@v7
      with:
        path: ${{ inputs.dist-path }}/${{ inputs.project-name }}_*_${{ inputs.os }}_${{ inputs.arch }}.${{ inputs.os == 'windows' && 'zip' || 'tar.gz' }}
        # Version-wildcarded glob can match more than one file, and archive:
        # false only supports a single guaranteed file (it would hard-fail on
        # multiple matches). Keep this zipped; the raw binary and .mcpb above
        # stay direct downloads via their exact staged/mcpb paths.
        archive: true
        if-no-files-found: warn
        retention-days: ${{ inputs.retention-days }}
