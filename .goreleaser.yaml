# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: pinner-cli

before:
    hooks:
        - sh -c "mkdir -p completions && go run ./cmd/pinner completion bash > completions/pinner.bash"
        - sh -c "go run ./cmd/pinner completion zsh > completions/pinner.zsh"
        - sh -c "go run ./cmd/pinner completion fish > completions/pinner.fish"

builds:
    - id: pinner-cli
      main: ./cmd/pinner
      binary: pinner
      env:
          - CGO_ENABLED=0
      goos:
          - linux
          - darwin
          - windows
      goarch:
          - amd64
          - arm64
      flags:
          - -trimpath
      ldflags:
          - -s -w
          - -X 'go.lumeweb.com/pinner-cli/build.Version={{.Version}}'
          - -X 'go.lumeweb.com/pinner-cli/build.GitCommit={{.Commit}}'
          - -X 'go.lumeweb.com/pinner-cli/build.GitBranch={{.Branch}}'
          - -X 'go.lumeweb.com/pinner-cli/build.BuildTime={{.CommitDate}}'
          - -X 'go.lumeweb.com/pinner-cli/build.GoVersion={{.Env.GO_VERSION}}'
          - -X 'go.lumeweb.com/pinner-cli/build.Platform={{.Os}}'
          - -X 'go.lumeweb.com/pinner-cli/build.Architecture={{.Arch}}'
      mod_timestamp: "{{.CommitTimestamp}}"

archives:
    - formats: [tar.gz]
      format_overrides:
          - goos: windows
            formats: [zip]
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
      files:
          - LICENSE
          - README.md
          - completions/*

checksum:
    name_template: checksums.txt

changelog:
    disable: true

release:
    github:
        owner: LumeWeb
        name: pinner-cli
    mode: keep-existing
    prerelease: auto

nfpms:
    - id: pinner-cli
      package_name: pinner-cli
      vendor: Pinner.xyz
      homepage: https://pinner.xyz
      description: "CLI for pinning content to IPFS, and deploying websites via Pinner.xyz"
      license: MIT
      maintainer: "Pinner <support@pinner.xyz>"
      formats:
          - deb
          - rpm
      bindir: /usr/bin
      contents:
          - src: ./completions/pinner.bash
            dst: /usr/share/bash-completion/completions/pinner
          - src: ./completions/pinner.zsh
            dst: /usr/share/zsh/site-functions/_pinner
          - src: ./completions/pinner.fish
            dst: /usr/share/fish/vendor_completions.d/pinner.fish

homebrew_taps:
    - name: pinner
      repository:
          owner: LumeWeb
          name: homebrew-tap
      homepage: https://pinner.xyz
      description: "CLI for pinning content to IPFS, and deploying websites via Pinner.xyz"
      license: MIT
      install: |
          bin.install "pinner"
      completions:
          bash: completions/pinner.bash
          zsh: completions/pinner.zsh
          fish: completions/pinner.fish

winget:
    - name: Pinner.Cli
      publisher: Pinner
      license: MIT
      copyright: Copyright (c) Pinner.xyz
      homepage: https://pinner.xyz
      short_description: "CLI for pinning content to IPFS"
      repository:
          owner: LumeWeb
          name: winget-pkgs
          branch: "pinner-cli-{{.Version}}"
          pull_request:
              enabled: true
              draft: true
              base:
                  owner: microsoft
                  name: winget-pkgs
                  branch: master
      path: manifests/Pinner/Cli/{{.Version}}

scoops:
    - name: pinner
      repository:
          owner: LumeWeb
          name: scoop-bucket
      homepage: https://pinner.xyz
      description: "CLI for pinning content to IPFS, and deploying websites via Pinner.xyz"
      license: MIT
