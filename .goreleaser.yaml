# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: pinner-cli

before:
    hooks:
        - sh -c "mkdir -p completions && go run ./cmd/pinner completion bash > completions/pinner.bash"
        - sh -c "go run ./cmd/pinner completion zsh > completions/pinner.zsh"
        - sh -c "go run ./cmd/pinner completion fish > completions/pinner.fish"
        - sh -c "mkdir -p manpages && go run ./cmd/pinner generate-docs man -o manpages/pinner.1"

builds:
    # Each build sets the CGO cross-compiler for its target. All toolchains
    # are provided by the goreleaser-cross Docker image (see CI workflows).
    # CGO must stay enabled on EVERY platform: the vault cache uses go-sqlite3,
    # a cgo driver that compiles to a runtime stub when CGO_ENABLED=0.
    - id: pinner-cli-linux-amd64
      main: ./cmd/pinner
      binary: pinner
      env:
          - CGO_ENABLED=1
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      goos: [linux]
      goarch: [amd64]
      flags: [-trimpath]
      ldflags: &ldflags
          - -s -w
          - -X 'go.lumeweb.com/pinner-cli/build.Version={{.Version}}'
          - -X 'go.lumeweb.com/pinner-cli/build.GitCommit={{.Commit}}'
          - -X 'go.lumeweb.com/pinner-cli/build.GitBranch={{.Branch}}'
          - -X 'go.lumeweb.com/pinner-cli/build.BuildTime={{.CommitDate}}'
          - -X 'go.lumeweb.com/pinner-cli/build.GoVersion={{.Env.GO_VERSION}}'
          - -X 'go.lumeweb.com/pinner-cli/build.Platform={{.Os}}'
          - -X 'go.lumeweb.com/pinner-cli/build.Architecture={{.Arch}}'
      mod_timestamp: "{{.CommitTimestamp}}"
    - id: pinner-cli-linux-arm64
      main: ./cmd/pinner
      binary: pinner
      env:
          - CGO_ENABLED=1
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      goos: [linux]
      goarch: [arm64]
      flags: [-trimpath]
      ldflags: *ldflags
      mod_timestamp: "{{.CommitTimestamp}}"
    - id: pinner-cli-darwin-amd64
      main: ./cmd/pinner
      binary: pinner
      env:
          - CGO_ENABLED=1
          - CC=o64-clang
          - CXX=o64-clang++
      goos: [darwin]
      goarch: [amd64]
      flags: [-trimpath]
      ldflags: *ldflags
      mod_timestamp: "{{.CommitTimestamp}}"
    - id: pinner-cli-darwin-arm64
      main: ./cmd/pinner
      binary: pinner
      env:
          - CGO_ENABLED=1
          - CC=oa64-clang
          - CXX=oa64-clang++
      goos: [darwin]
      goarch: [arm64]
      flags: [-trimpath]
      ldflags: *ldflags
      mod_timestamp: "{{.CommitTimestamp}}"
    - id: pinner-cli-windows-amd64
      main: ./cmd/pinner
      binary: pinner
      env:
          - CGO_ENABLED=1
          - CC=x86_64-w64-mingw32-gcc
          - CXX=x86_64-w64-mingw32-g++
      goos: [windows]
      goarch: [amd64]
      flags: [-trimpath]
      ldflags: *ldflags
      mod_timestamp: "{{.CommitTimestamp}}"
    - id: pinner-cli-windows-arm64
      main: ./cmd/pinner
      binary: pinner
      env:
          - CGO_ENABLED=1
          - CC=/llvm-mingw/bin/aarch64-w64-mingw32-gcc
          - CXX=/llvm-mingw/bin/aarch64-w64-mingw32-g++
      goos: [windows]
      goarch: [arm64]
      flags: [-trimpath]
      ldflags: *ldflags
      mod_timestamp: "{{.CommitTimestamp}}"

archives:
    - formats: [tar.gz]
      format_overrides:
          - goos: windows
            formats: [zip]
      name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
      files:
          - LICENSE
          - README.md
          - completions/*
          - manpages/*

checksum:
    name_template: checksums.txt

changelog:
    disable: true

release:
    github:
        owner: LumeWeb
        name: pinner-cli
    mode: keep-existing
    prerelease: auto

# Publish the canonical OCI image to GHCR as part of the same release. The
# multi-stage Dockerfile builds a static musl+cgo binary (go-sqlite3 requires
# CGO), so goreleaser builds+pushes via buildx rather than consuming a
# prebuilt dist/ artifact. Amd64 + arm64 are combined into versioned and
# latest multi-arch manifests that MCP registries, AI clients, and PaaS all
# consume directly.
dockers:
    - id: pinner-linux-amd64
      goos: linux
      goarch: amd64
      image_templates:
          - "ghcr.io/lumeweb/pinner:{{ .Version }}-amd64"
          - "ghcr.io/lumeweb/pinner:latest-amd64"
      dockerfile: Dockerfile
      use: buildx
      build_flag_templates:
          - "--platform=linux/amd64"
          - "--build-arg=VERSION={{ .Version }}"
          - "--build-arg=GIT_COMMIT={{ .Commit }}"
          - "--build-arg=GIT_BRANCH={{ .Branch }}"
          - "--build-arg=BUILD_TIME={{ .CommitTimestamp }}"
          - "--label=org.opencontainers.image.title=Pinner"
          - "--label=org.opencontainers.image.description=CLI and MCP server for Pinner.xyz"
          - "--label=org.opencontainers.image.vendor=Pinner.xyz"
          - "--label=org.opencontainers.image.licenses=MIT"
          - "--label=org.opencontainers.image.version={{ .Version }}"
          - "--label=org.opencontainers.image.revision={{ .Commit }}"
          - "--label=org.opencontainers.image.source=https://github.com/LumeWeb/pinner-cli"
          # Official MCP Registry ownership annotation (must equal server.json name):
          - "--label=io.modelcontextprotocol.server.name=xyz.pinner/mcp"
      extra_files:
          - docker-entrypoint.sh
    - id: pinner-linux-arm64
      goos: linux
      goarch: arm64
      image_templates:
          - "ghcr.io/lumeweb/pinner:{{ .Version }}-arm64"
          - "ghcr.io/lumeweb/pinner:latest-arm64"
      dockerfile: Dockerfile
      use: buildx
      build_flag_templates:
          - "--platform=linux/arm64"
          - "--build-arg=VERSION={{ .Version }}"
          - "--build-arg=GIT_COMMIT={{ .Commit }}"
          - "--build-arg=GIT_BRANCH={{ .Branch }}"
          - "--build-arg=BUILD_TIME={{ .CommitTimestamp }}"
          - "--label=org.opencontainers.image.title=Pinner"
          - "--label=org.opencontainers.image.description=CLI and MCP server for Pinner.xyz"
          - "--label=org.opencontainers.image.vendor=Pinner.xyz"
          - "--label=org.opencontainers.image.licenses=MIT"
          - "--label=org.opencontainers.image.version={{ .Version }}"
          - "--label=org.opencontainers.image.revision={{ .Commit }}"
          - "--label=org.opencontainers.image.source=https://github.com/LumeWeb/pinner-cli"
          - "--label=io.modelcontextprotocol.server.name=xyz.pinner/mcp"
      extra_files:
          - docker-entrypoint.sh

docker_manifests:
    - name_template: "ghcr.io/lumeweb/pinner:{{ .Version }}"
      image_templates:
          - "ghcr.io/lumeweb/pinner:{{ .Version }}-amd64"
          - "ghcr.io/lumeweb/pinner:{{ .Version }}-arm64"
    - name_template: "ghcr.io/lumeweb/pinner:latest"
      image_templates:
          - "ghcr.io/lumeweb/pinner:latest-amd64"
          - "ghcr.io/lumeweb/pinner:latest-arm64"

nfpms:
    - id: pinner-cli
      package_name: pinner-cli
      vendor: Pinner.xyz
      homepage: https://pinner.xyz
      description: "CLI for pinning content to IPFS, and deploying websites via Pinner.xyz"
      license: MIT
      maintainer: "Pinner <support@pinner.xyz>"
      formats:
          - deb
          - rpm
      bindir: /usr/bin
      contents:
          - src: ./completions/pinner.bash
            dst: /usr/share/bash-completion/completions/pinner
          - src: ./completions/pinner.zsh
            dst: /usr/share/zsh/site-functions/_pinner
          - src: ./completions/pinner.fish
            dst: /usr/share/fish/vendor_completions.d/pinner.fish
          - src: ./manpages/pinner.1
            dst: /usr/share/man/man1/pinner.1

homebrew_casks:
    - name: pinner
      repository:
          owner: LumeWeb
          name: homebrew-tap
      homepage: https://pinner.xyz
      description: "CLI for pinning content to IPFS, and deploying websites via Pinner.xyz"
      license: MIT
      binaries:
          - pinner
      completions:
          bash: completions/pinner.bash
          zsh: completions/pinner.zsh
          fish: completions/pinner.fish

winget:
    - name: Cli
      package_name: Pinner CLI
      publisher: Pinner
      package_identifier: Pinner.Cli
      license: MIT
      copyright: Copyright (c) Hammer Technologies LLC
      homepage: https://pinner.xyz
      short_description: "CLI for pinning content to IPFS"
      repository:
          owner: LumeWeb
          name: winget-pkgs
          branch: "pinner-cli-{{.Version}}"
          pull_request:
              enabled: true
              draft: true
              base:
                  owner: microsoft
                  name: winget-pkgs
                  branch: master
      path: manifests/p/Pinner/Cli/{{.Version}}

scoops:
    - name: pinner
      repository:
          owner: LumeWeb
          name: scoop-bucket
      homepage: https://pinner.xyz
      description: "CLI for pinning content to IPFS, and deploying websites via Pinner.xyz"
      license: MIT

# Build and attach Pinner MCP Bundles (.mcpb) to the GitHub release.
#
# A .mcpb is a zip of a server binary + a manifest.json describing how to run
# it as a local MCP server (one-click install into Claude Desktop / other
# MCPB-supporting apps). Because the binary is platform-specific, each OS/arch
# gets its own bundle. This runs as a custom publisher over the compiled
# binaries (all present in dist/ after the cross build), producing a .mcpb per
# platform and uploading it to the release created by the release pipe.
#
# PROJECT_DIR is expected to be set in the release environment to the absolute
# path of the repository root (the goreleaser-cross release job sets it to
# $PWD). The pack script derives the manifest template location itself, so it
# only needs the binary path, os, arch, and version.
publishers:
    - name: pinner-mcpb
      ids:
          - pinner-cli-linux-amd64
          - pinner-cli-linux-arm64
          - pinner-cli-darwin-amd64
          - pinner-cli-darwin-arm64
          - pinner-cli-windows-amd64
          - pinner-cli-windows-arm64
      dir: "{{ .Env.PROJECT_DIR }}"
      cmd: |
          scripts/mcpb-pack.sh "{{ .ArtifactPath }}" "{{ .Os }}" "{{ .Arch }}" "{{ .Version }}" --upload
      env:
          - GITHUB_TOKEN={{ .Env.GITHUB_TOKEN }}
