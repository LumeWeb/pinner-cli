template: testify
template-data:
  unroll-variadic: true
filename: "{{.InterfaceName}}.go"
include-auto-generated: true
packages:
  go.lumeweb.com/pinner-cli/pkg/config:
    config:
      dir: ./pkg/config/mocks
      pkgname: "mocks"
    interfaces:
      Manager: {}
  go.lumeweb.com/pinner-cli/pkg/cli:
    config:
      filename: "mock_{{.InterfaceName}}.go"
      dir: "{{.InterfaceDir}}"
      pkgname: "{{.SrcPackageName}}"
    interfaces:
      AuthPrompter: {}
      AuthService: {}
      PinningService: {}
      UploadService: {}
      DownloadService: {}
      QuotaAdminService: {}
      BillingAdminService: {}
      WebsiteAdminService: {}
      ProfilingAdminService: {}
      StatusService: {}
      OperationsService: {}
      APIKeyService: {}
  go.lumeweb.com/pinner-cli/pkg/cli/internal:
    config:
      dir: ./pkg/cli/internal/mocks
      pkgname: "mocks"
    interfaces:
      PinningClient: {}
