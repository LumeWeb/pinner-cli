template: testify
template-data:
  unroll-variadic: true
filename: "{{.InterfaceName}}.go"
include-auto-generated: true
packages:
  go.lumeweb.com/pinner-cli/internal/core/config:
    config:
      dir: ./internal/core/config/mocks
      pkgname: "mocks"
    interfaces:
      Manager: {}
  go.lumeweb.com/pinner-cli/internal/core/auth:
    config:
      dir: ./pkg/cli
      pkgname: "cli"
    interfaces:
      AuthService:
        config:
          filename: "mock_AuthService.go"
  go.lumeweb.com/pinner-cli/pkg/cli:
    config:
      filename: "mock_{{.InterfaceName}}.go"
      dir: "{{.InterfaceDir}}"
      pkgname: "{{.SrcPackageName}}"
    interfaces:
      AuthPrompter: {}
      PinningService: {}
      UploadService: {}
      DownloadService: {}
      QuotaAdminService: {}
      BillingAdminService: {}
      WebsiteAdminService: {}
      ProfilingAdminService: {}
      StatusService: {}
      OperationsService: {}
      APIKeyService: {}
  go.lumeweb.com/pinner-cli/internal/catalog:
    config:
      dir: ./internal/catalog/mocks
      pkgname: "mocks"
    interfaces:
      Catalog: {}
      Compiler: {}
  go.lumeweb.com/pinner-cli/pkg/cli/internal:
    config:
      dir: ./pkg/cli/internal/mocks
      pkgname: "mocks"
    interfaces:
      PinningClient: {}
