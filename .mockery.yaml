template: testify
template-data:
  unroll-variadic: true
filename: "{{.InterfaceName}}.go"
packages:
  go.lumeweb.com/pinner/core/config:
    config:
      dir: ./internal/core/config/mocks
      pkgname: "mocks"
    interfaces:
      Manager: {}
  go.lumeweb.com/pinner/core/auth:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      AuthService:
        config:
          filename: "mock_AuthService.go"
  go.lumeweb.com/pinner/core/uploads:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      Service:
        config:
          structname: "MockUploadService"
          filename: "mock_UploadService.go"
  go.lumeweb.com/pinner/core/download:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      Service:
        config:
          structname: "MockDownloadService"
          filename: "mock_DownloadService.go"
  go.lumeweb.com/pinner/core/operations:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      Service:
        config:
          structname: "MockOperationsService"
          filename: "mock_OperationsService.go"
  go.lumeweb.com/pinner/core/apikeys:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      Service:
        config:
          structname: "MockAPIKeyService"
          filename: "mock_APIKeyService.go"
  go.lumeweb.com/pinner/core/pinning:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      PinningService:
        config:
          filename: "mock_PinningService.go"
      StatusService:
        config:
          filename: "mock_StatusService.go"
  go.lumeweb.com/pinner/core/admin:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      QuotaAdminService:
        config:
          filename: "mock_QuotaAdminService.go"
      BillingAdminService:
        config:
          filename: "mock_BillingAdminService.go"
      WebsiteAdminService:
        config:
          filename: "mock_WebsiteAdminService.go"
      ProfilingAdminService:
        config:
          filename: "mock_ProfilingAdminService.go"
      PlatformDomainAdminService:
        config:
          filename: "mock_PlatformDomainAdminService.go"
  go.lumeweb.com/pinner-cli/internal/cli:
    config:
      dir: ./internal/cli
      pkgname: "cli"
    interfaces:
      AuthPrompter:
        config:
          filename: "mock_AuthPrompter.go"
  go.lumeweb.com/pinner-cli/internal/cli/internal:
    config:
      dir: ./internal/cli/internal/mocks
      pkgname: "mocks"
    interfaces:
      PinningClient: {}
